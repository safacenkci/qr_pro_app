# flutter gen-l10n ayarları. Şablon Türkçe; desteklenmeyen cihaz dillerinde
# İngilizceye düşülmesi için en, desteklenen diller listesinin başında.
arb-dir: lib/l10n
template-arb-file: app_tr.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
preferred-supported-locales:
  - en
# Flutter 3.47+ Global*Localizations'ı material_ui/cupertino_ui paketlerine
# taşıdı; gen-l10n hâlâ eski adları üretiyor. Proje material.dart'tan
# geçene kadar üretilen dosyadaki bu bilgi uyarısını sustur.
header: "// ignore_for_file: deprecated_member_use"
