# flutter gen-l10n ayarları. Şablon Türkçe; desteklenmeyen cihaz dillerinde
# İngilizceye düşülmesi için en, desteklenen diller listesinin başında.
arb-dir: lib/l10n
template-arb-file: app_tr.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
preferred-supported-locales:
  - en
