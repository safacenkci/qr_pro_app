name: qrpro

services:
  api:
    build: .
    image: qrpro-api:latest
    container_name: qrpro-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:4400:8000"
    volumes:
      - qrpro-data:/data
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qrpro-data:
